version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: f1_bot_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init_db:/docker-entrypoint-initdb.d

  bot:
    build: .
    container_name: f1_bot_app
    restart: always
    depends_on:
      - db
    env_file:
      - .env

volumes:
  pgdata: